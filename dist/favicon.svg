<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">BabiesIQ</title>
  <desc id="desc">A colorful BabiesIQ baby face icon</desc>
  <defs>
    <radialGradient id="background" cx="28%" cy="22%" r="92%">
      <stop offset="0" stop-color="#63d9ff"/>
      <stop offset="0.38" stop-color="#2d7ff0"/>
      <stop offset="0.72" stop-color="#5650d8"/>
      <stop offset="1" stop-color="#161a38"/>
    </radialGradient>
    <linearGradient id="ring" x1="84" y1="42" x2="430" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff7a8"/>
      <stop offset="0.22" stop-color="#ff9d82"/>
      <stop offset="0.5" stop-color="#ef6fe7"/>
      <stop offset="0.74" stop-color="#54cfff"/>
      <stop offset="1" stop-color="#7df4c4"/>
    </linearGradient>
    <linearGradient id="face" x1="174" y1="138" x2="339" y2="378" gradientUnits="userSpaceOnUse">
